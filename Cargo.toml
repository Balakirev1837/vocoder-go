[package]
name = "vocoder"
version = "0.1.0"
edition = "2024"

[features]
default = ["audio", "midi", "tui"]
audio = ["dep:cpal"]
midi = ["dep:midir"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
cpal = { version = "0.15", optional = true }
midir = { version = "0.10", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
anyhow = "1"
